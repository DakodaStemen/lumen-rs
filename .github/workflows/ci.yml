name: Rust
on: [push, pull_request]
permissions:
  contents: read
env:
  APT_DEPS: libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libmpv-dev ffmpeg streamlink
jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install libmpv and ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - name: Install libmpv and ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mpv ffmpeg
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Install libmpv and ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          choco install ffmpeg -y --no-progress
          ./scripts/windows-libmpv.ps1
      - run: rustc --version && cargo --version
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo +1.88 check --locked

  stable-floating:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-audit, cargo-deny
      - run: cargo audit
      - run: cargo deny check

  newer-libmpv:
    name: playback (Arch, libmpv >= 0.41)
    runs-on: ubuntu-latest
    container: archlinux:latest
    # Temporary: a_loaded_subtitle_file_comes_back_with_the_video fails on mpv
    # 0.41 (subtitle restoration backend bug). Remove after the backend fix lands.
    continue-on-error: true
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Install build and playback dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel git rust mpv ffmpeg streamlink
          libx11 libxkbcommon wayland mesa xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require newer mpv
        run: |
          mpv --version
          ver=$(pkg-config --modversion mpv)
          echo "libmpv API version: $ver"
          pkg=$(pacman -Q mpv | cut -d ' ' -f 2)
          test "$(vercmp "${pkg#*:}" 0.41.0)" -ge 0
      - name: Build and test against system libmpv
        run: xvfb-run -a -s "-screen 0 1600x1000x24" cargo test --locked

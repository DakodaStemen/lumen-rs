[package]
name = "lumen-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Lumen rebuilt as a native Rust media player on libmpv."
license = "MIT"
repository = "https://github.com/DakodaStemen/lumen-rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "accesskit"] }
fastrand = "2"
libc = "0.2"
libmpv2 = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
